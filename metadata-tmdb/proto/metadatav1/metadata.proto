syntax = "proto3";
package muxcore.metadata.v1;
option go_package = "github.com/Muxcore-Media/metadata-tmdb/proto/metadatav1;metadatav1";

service MetadataService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetMovieDetails(GetMovieDetailsRequest) returns (GetMovieDetailsResponse);
  rpc GetTVDetails(GetTVDetailsRequest) returns (GetTVDetailsResponse);
  rpc GetConfiguration(GetConfigurationRequest) returns (GetConfigurationResponse);
}

message SearchRequest {
  string query = 1;
  MediaType type = 2;
  int32 page = 3;
  string language = 4;
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_MOVIE = 1;
  MEDIA_TYPE_TV = 2;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_results = 2;
  int32 total_pages = 3;
  int32 page = 4;
}

message SearchResult {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  double vote_average = 7;
  int32 vote_count = 8;
  string release_date = 9;
  MediaType media_type = 10;
  repeated int32 genre_ids = 11;
  string original_language = 12;
  double popularity = 13;
  string name = 14;
  string first_air_date = 15;
}

message GetMovieDetailsRequest {
  int32 tmdb_id = 1;
  string language = 2;
  repeated string append_to_response = 3;
}

message GetMovieDetailsResponse {
  int32 id = 1;
  string title = 2;
  string original_title = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string release_date = 8;
  int32 runtime = 9;
  double vote_average = 10;
  int32 vote_count = 11;
  double popularity = 12;
  string status = 13;
  string original_language = 14;
  bool adult = 15;
  int64 budget = 16;
  int64 revenue = 17;
  string homepage = 18;
  string imdb_id = 19;
  repeated Genre genres = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  Collection belongs_to_collection = 27;
}

message Collection {
  int32 id = 1;
  string name = 2;
  string poster_path = 3;
  string backdrop_path = 4;
}

message Genre {
  int32 id = 1;
  string name = 2;
}

message ProductionCompany {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message SpokenLanguage {
  string iso_639_1 = 1;
  string name = 2;
}

message Video {
  string id = 1;
  string key = 2;
  string name = 3;
  string site = 4;
  string type = 5;
}

message Credits {
  repeated CastMember cast = 1;
  repeated CrewMember crew = 2;
}

message CastMember {
  int32 id = 1;
  string name = 2;
  string character = 3;
  string profile_path = 4;
  int32 order = 5;
}

message CrewMember {
  int32 id = 1;
  string name = 2;
  string job = 3;
  string department = 4;
  string profile_path = 5;
}

message GetTVDetailsRequest {
  int32 tmdb_id = 1;
  string language = 2;
  repeated string append_to_response = 3;
}

message GetTVDetailsResponse {
  int32 id = 1;
  string name = 2;
  string original_name = 3;
  string overview = 4;
  string tagline = 5;
  string poster_path = 6;
  string backdrop_path = 7;
  string first_air_date = 8;
  string last_air_date = 9;
  int32 number_of_seasons = 10;
  int32 number_of_episodes = 11;
  double vote_average = 12;
  int32 vote_count = 13;
  double popularity = 14;
  string status = 15;
  string original_language = 16;
  string homepage = 17;
  string in_production = 18;
  repeated Genre genres = 19;
  repeated Season seasons = 20;
  repeated ProductionCompany production_companies = 21;
  repeated SpokenLanguage spoken_languages = 22;
  string backdrop_url = 23;
  string poster_url = 24;
  repeated Video videos = 25;
  repeated Credits credits = 26;
  repeated CreatedBy created_by = 27;
  repeated Network networks = 28;
  repeated string origin_country = 29;
}

message CreatedBy {
  int32 id = 1;
  string name = 2;
  string profile_path = 3;
}

message Network {
  int32 id = 1;
  string name = 2;
  string logo_path = 3;
  string origin_country = 4;
}

message Season {
  int32 id = 1;
  string name = 2;
  string overview = 3;
  string poster_path = 4;
  string air_date = 5;
  int32 season_number = 6;
  int32 episode_count = 7;
  double vote_average = 8;
}

message GetConfigurationRequest {}

message GetConfigurationResponse {
  string base_url = 1;
  repeated string poster_sizes = 2;
  repeated string backdrop_sizes = 3;
  repeated string logo_sizes = 4;
  repeated string profile_sizes = 5;
  repeated string still_sizes = 6;
  string secure_base_url = 7;
}

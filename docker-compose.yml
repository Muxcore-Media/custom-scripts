services:
  # ── Core Cluster ──────────────────────────────────────────
  core:
    hostname: core
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "9090:9090"
      - "8081:8081"
    environment:
      - MUXCORE_INSECURE_DISABLE_TLS=true
      - MUXCORE_SERVER_ADDR=:8081
      - MUXCORE_GRPC_JOIN_TOKEN=dev-cluster-token
      - MUXCORE_GRPC_CA_CERT_DIR=/app/data/ca
    volumes:
      - core-data:/app/data
      - core-tmp:/app/tmp
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8081/health > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  core-2:
    hostname: core-2
    build:
      context: .
      dockerfile: core/Dockerfile
    ports:
      - "9091:9090"
    environment:
      - MUXCORE_INSECURE_DISABLE_TLS=true
      - MUXCORE_SERVER_ADDR=:8082
      - MUXCORE_GRPC_SEED_NODES=core:9090
      - MUXCORE_GRPC_JOIN_TOKEN=dev-cluster-token
      - MUXCORE_GRPC_CA_CERT_DIR=/app/data/ca
    volumes:
      - core-2-data:/app/data
      - core-2-tmp:/app/tmp
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:8082/health > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  # ── Existing Sidecar Modules ──────────────────────────────
  admin-ui:
    build:
      context: .
      dockerfile: admin-ui/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ADMIN_UI_ADDR=:8082
      - ADMIN_UI_INSECURE=true
      - ADMIN_UI_CORE_ADDR=core:9090
      - ADMIN_UI_AUTH_ADDR=http://auth-local:9041
      - ADMIN_UI_AUTH_PUBLIC_URL=http://localhost:9041
      - ADMIN_UI_TRUSTED_AUTH_HEADER=X-Auth-User
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  # ── Infrastructure ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # ── New Modules ───────────────────────────────────────────
  # ── Core-1 Modules ────────────────────────────────────────
  cache-redis:
    build:
      context: .
      dockerfile: cache-redis/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - REDIS_ADDR=redis:6379
      - CACHE_GRPC_ADDR=:9600
    depends_on:
      core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  database-sqlite:
    build:
      context: .
      dockerfile: database-sqlite/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - SQLITE_DB_PATH=/data/muxcore.db
    volumes:
      - sqlite-data:/data
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  feature-flags-file:
    build:
      context: .
      dockerfile: feature-flags-file/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - FEATURE_FLAGS_FILE=/data/flags.yaml
    volumes:
      - ./flags.yaml:/data/flags.yaml:ro
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  health-monitor:
    build:
      context: .
      dockerfile: health-monitor/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  secrets-file:
    build:
      context: .
      dockerfile: secrets-file/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - SECRETS_STORE=/data/secrets.json
      - SECRETS_KEY_FILE=/data/master.key
    volumes:
      - secrets-data:/data
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  auth-local:
    build:
      context: .
      dockerfile: auth-local/Dockerfile
    ports:
      - "9041:9041"
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - AUTH_HTTP_ADDR=:9041
      - AUTH_DB_PATH=/data/auth.db
    volumes:
      - auth-data:/data
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  call-policy:
    build:
      context: .
      dockerfile: call-policy-default/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  publish-policy:
    build:
      context: .
      dockerfile: publish-policy-default/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  # ── Core-2 Modules ────────────────────────────────────────
  backup-local:
    build:
      context: .
      dockerfile: backup-local/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
      - BACKUP_DIR=/data/backups
    volumes:
      - backup-data:/data
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  metrics-prometheus:
    build:
      context: .
      dockerfile: metrics-prometheus/Dockerfile
    ports:
      - "9901:9901"
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  ratelimit-tokenbucket:
    build:
      context: .
      dockerfile: ratelimit-tokenbucket/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
      - RATELIMIT_RATE=100
      - RATELIMIT_BURST=200
      - RATELIMIT_ENABLED=true
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  encryption-aesgcm:
    build:
      context: .
      dockerfile: encryption-aesgcm/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
      - ENCRYPTION_KEY_FILE=/data/master.key
    volumes:
      - encryption-data:/data
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  executor-shell:
    build:
      context: .
      dockerfile: executor-shell/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  workflow-tapestry:
    build:
      context: .
      dockerfile: workflow-tapestry/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  tracing-otlp:
    build:
      context: .
      dockerfile: tracing-otlp/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  config-watcher:
    build:
      context: .
      dockerfile: config-watcher/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core-2:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core:9090
    depends_on:
      core-2:
        condition: service_started
    restart: unless-stopped

  distributed-lock-sqlite:
    build:
      context: .
      dockerfile: distributed-lock-sqlite/Dockerfile
    environment:
      - MUXCORE_GRPC_ADDR=core:9090
      - MUXCORE_GRPC_INSECURE=true
      - MUXCORE_GRPC_SEED_NODES=core-2:9090
      - LOCK_DB_PATH=/data/locks.db
      - LOCK_GRPC_ADDR=:9610
    volumes:
      - lock-data:/data
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

volumes:
  core-data:
  core-tmp:
  core-2-data:
  core-2-tmp:
  auth-data:
  sqlite-data:
  backup-data:
  secrets-data:
  encryption-data:
  lock-data:
